<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Checkout — SatvikMeals</title>
<link rel="icon" href="/logo.jpg"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#FDFCF8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:white;border:1px solid #E5E2D8;border-radius:16px;padding:36px 28px;max-width:460px;width:100%;animation:fadeUp 0.5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:#1B4332;font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;margin-bottom:24px}
.logo img{width:34px;height:34px;border-radius:7px;object-fit:cover}
h1{font-family:'Cormorant Garamond',serif;font-size:1.75rem;font-weight:300;color:#0F2D1F;margin-bottom:4px}
h1 em{font-style:italic;color:#2D6A4F}
.subtitle{font-size:0.845rem;color:#7A7A6E;font-weight:300;margin-bottom:20px}
.steps{display:flex;align-items:center;gap:6px;margin-bottom:22px}
.step{display:flex;align-items:center;gap:5px;font-size:0.72rem;color:#7A7A6E}
.step-num{width:22px;height:22px;border-radius:50%;background:#E5E2D8;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:500;flex-shrink:0}
.step.done .step-num{background:#1B4332;color:white}
.step.active .step-num{background:#2D6A4F;color:white}
.step.active{color:#1B4332;font-weight:500}
.step-line{height:1px;flex:1;background:#E5E2D8}
.user-info{background:#F0FAF2;border:1px solid #D8F3DC;border-radius:9px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:#1B4332;color:white;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:500;flex-shrink:0}
.summary{background:#F0FAF2;border:1px solid #D8F3DC;border-radius:10px;padding:20px;margin-bottom:18px}
.s-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #E5E2D8;font-size:0.855rem}
.s-row:last-child{border:none;font-weight:500;font-size:0.95rem;color:#1B4332;padding-top:10px}
.s-label{color:#7A7A6E;font-weight:300}
.field{margin-bottom:16px}
.field label{display:block;font-size:0.7rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:#7A7A6E;margin-bottom:6px}
.field input{width:100%;height:48px;border:1.5px solid #E5E2D8;border-radius:8px;padding:0 14px;font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;transition:all 0.2s;-webkit-appearance:none;background:white}
.field input:focus{border-color:#40916C;box-shadow:0 0 0 3px rgba(64,145,108,0.1)}
.field .hint{font-size:0.72rem;color:#7A7A6E;margin-top:5px}
.phone-ok{background:#F0FAF2;border:1px solid #D8F3DC;border-radius:8px;padding:11px 14px;font-size:0.845rem;color:#1B4332;margin-bottom:16px;display:none}

/* THE BUTTON — clean, no payment gateway mention */
.btn-pay{width:100%;height:52px;background:#1B4332;color:white;border:none;border-radius:9px;font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;letter-spacing:0.05em;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;position:relative;overflow:hidden}
.btn-pay::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent);pointer-events:none}
.btn-pay:hover{background:#2D6A4F;transform:translateY(-1px);box-shadow:0 6px 20px rgba(27,67,50,0.25)}
.btn-pay:active{transform:translateY(0)}
.btn-pay:disabled{background:#9CA3AF;cursor:not-allowed;transform:none;box-shadow:none}
.btn-pay svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0}

.secure-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.secure-item{display:flex;align-items:center;gap:5px;font-size:0.7rem;color:#7A7A6E;font-weight:300}
.secure-item svg{width:13px;height:13px;stroke:#40916C;fill:none;stroke-width:2;flex-shrink:0}

.back{display:block;text-align:center;font-size:0.8rem;color:#7A7A6E;text-decoration:none;margin-top:4px}
.back:hover{color:#1B4332}
.err{background:#FFF5F5;border-left:3px solid #c53030;border-radius:6px;color:#c53030;padding:12px 14px;font-size:0.845rem;margin-top:12px;display:none}
.info{background:#FFFBEB;border-left:3px solid #F59E0B;border-radius:6px;color:#92400E;padding:10px 14px;font-size:0.82rem;margin-bottom:14px;display:none}
</style>
</head>
<body>
<div class="card">
  <a href="index.html" class="logo">
    <img src="/logo.jpg" alt="SatvikMeals"/>
    SatvikMeals
  </a>

  <div class="steps">
    <div class="step done"><div class="step-num">✓</div>Plan</div>
    <div class="step-line"></div>
    <div class="step active"><div class="step-num">2</div>Confirm</div>
    <div class="step-line"></div>
    <div class="step"><div class="step-num">3</div>Pay</div>
  </div>

  <h1>Confirm <em>your order</em></h1>
  <div class="subtitle">Review details before proceeding to secure payment.</div>

  <div class="user-info" id="userInfo" style="display:none">
    <div class="avatar" id="uAvatar">?</div>
    <div>
      <div style="font-size:0.875rem;font-weight:400;color:#1A1A16" id="uName"></div>
      <div style="font-size:0.75rem;color:#7A7A6E;font-weight:300" id="uEmail"></div>
    </div>
  </div>

  <div class="summary" id="summary">Loading...</div>
  <div class="info" id="infoBox"></div>
  <div class="phone-ok" id="phoneOk"></div>

  <div class="field" id="phoneField" style="display:none;background:#fffbf0;border:1.5px solid #f0c040;border-radius:10px;padding:16px">
    <label>📱 Mobile Number * <small style="color:var(--tl);font-weight:300">(Required for delivery)</small></label>
    <input type="tel" id="phoneInput" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" pattern="[6-9][0-9]{9}"/>
    <div class="hint">Required for delivery coordination only.</div>
  </div>

  <button class="btn-pay" id="payBtn" onclick="pay()">
    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Complete Purchase · ₹<span id="btnAmount">...</span>
  </button>

  <div class="secure-row">
    <div class="secure-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secure payment
    </div>
    <div class="secure-item">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      Encrypted
    </div>
    <div class="secure-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Instant activation
    </div>
  </div>

  <a href="plans.html" class="back">← Back to plans</a>
  <div class="err" id="errMsg"></div>
</div>

<script>
const API   = '';
const token = localStorage.getItem('satvikToken');
if (!token) { window.location.href = 'login.html?redirect=plans.html'; }

const params   = new URLSearchParams(window.location.search);
const planId   = params.get('planId');
const planName = decodeURIComponent(params.get('planName') || '');
const price    = parseInt(params.get('price') || 0);
const coins    = parseInt(params.get('coins') || 0);
const final    = price - coins;
let   userPhone = null;

document.getElementById('btnAmount').textContent = final;

async function init() {
  if (!planId) { showErr('No plan selected. Go back and choose a plan.'); return; }
  try {
    const r = await fetch(API + '/api/user/dashboard', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (r.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return; }
    const d = await r.json();
    userPhone = d.phone || null;

    document.getElementById('userInfo').style.display = 'flex';
    document.getElementById('uAvatar').textContent = (d.name || 'U')[0].toUpperCase();
    document.getElementById('uName').textContent   = d.name || '';
    document.getElementById('uEmail').textContent  = d.email || '';

    if (userPhone) {
      const box = document.getElementById('phoneOk');
      box.style.display = 'block';
      box.textContent   = '✓ Delivery to: +91 ' + userPhone;
    } else {
      document.getElementById('phoneField').style.display = 'block';
      showInfo('Please add your mobile number for delivery.');
    }
  } catch(e) {
    showInfo('Could not load your details. Please check connection.');
  }

  let html = `
    <div class="s-row"><span class="s-label">Plan</span><span>${planName}</span></div>
    <div class="s-row"><span class="s-label">Price</span><span>₹${price}</span></div>`;
  if (coins > 0) {
    html += `<div class="s-row"><span class="s-label" style="color:#B5965A">Coins discount</span><span style="color:#B5965A">− ₹${coins}</span></div>`;
  }
  html += `<div class="s-row"><span>Total</span><span>₹${final}</span></div>`;
  document.getElementById('summary').innerHTML = html;
}

async function pay() {
  const btn = document.getElementById('payBtn');
  hideErr();

  if (!userPhone) {
    const phoneVal = document.getElementById('phoneInput').value.trim();
    if (!phoneVal || phoneVal.length !== 10 || !/^[6-9]/.test(phoneVal)) {
      showErr('Please enter a valid 10-digit mobile number starting with 6, 7, 8 or 9.');
      document.getElementById('phoneInput').focus();
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Saving number...';

    try {
      const pr = await fetch(API + '/api/auth/save-phone', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body:    JSON.stringify({ phone: phoneVal })
      });
      const pd = await pr.json();
      if (!pr.ok) {
        showErr(pd.message || 'Could not save number. Please try again.');
        btn.disabled = false;
        resetBtn();
        return;
      }
      userPhone = phoneVal;
      document.getElementById('phoneField').style.display = 'none';
      document.getElementById('infoBox').style.display    = 'none';
      const box = document.getElementById('phoneOk');
      box.style.display = 'block';
      box.textContent   = '✓ Delivery to: +91 ' + phoneVal;
    } catch(e) {
      showErr('Network error. Please check your connection.');
      btn.disabled = false;
      resetBtn();
      return;
    }
  }

  btn.disabled    = true;
  btn.textContent = 'Processing...';

  try {
    const r = await fetch(API + '/api/payment/create', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body:    JSON.stringify({ planId, useCoins: coins > 0 })
    });
    const d = await r.json();
    if (!r.ok) {
      showErr(d.message || 'Something went wrong. Please try again.');
      btn.disabled = false;
      resetBtn();
      return;
    }
    btn.textContent = '✓ Redirecting...';
    window.location.href = d.paymentUrl;
  } catch(e) {
    showErr('Cannot reach server. Please check your connection.');
    btn.disabled = false;
    resetBtn();
  }
}

function resetBtn() {
  const btn = document.getElementById('payBtn');
  btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:white;fill:none;stroke-width:1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Complete Purchase · ₹' + final;
}
function showErr(msg)  { const e=document.getElementById('errMsg'); e.textContent=msg; e.style.display='block'; }
function hideErr()     { document.getElementById('errMsg').style.display='none'; }
function showInfo(msg) { const b=document.getElementById('infoBox'); b.textContent=msg; b.style.display='block'; }

init();
</script>
</body>
</html>
