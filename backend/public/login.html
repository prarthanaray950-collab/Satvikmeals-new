<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — SatvikMeals</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--g9:#0A2415;--g8:#163B26;--g7:#1E5C39;--g6:#2E8B57;--g5:#3DAA6C;--g0:#EDFAF3;--g00:#F6FDF9;--cream:#FDFAF4;--warm:#FEFCF8;--text:#0F1F14;--text2:#2D4A38;--text3:#6B8C78;--border:#D6EBE0;--shadow:rgba(14,55,33,0.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:linear-gradient(150deg,var(--warm) 0%,var(--g00) 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.back-link{position:fixed;top:20px;left:20px;display:flex;align-items:center;gap:6px;font-size:0.82rem;font-weight:600;color:var(--text3);text-decoration:none;padding:8px 14px;background:white;border:1px solid var(--border);border-radius:8px;transition:border-color 0.2s}
.back-link:hover{border-color:var(--g5);color:var(--g7)}
.card{background:white;border:1px solid var(--border);border-radius:20px;padding:48px 40px;max-width:420px;width:100%;box-shadow:0 16px 56px var(--shadow);animation:fadeUp 0.5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;margin-bottom:32px}
.logo-icon{width:44px;height:44px;background:var(--g8);border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:22px;height:22px;fill:var(--cream)}
.logo-text{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;color:var(--g8)}
.logo-sub{font-size:0.58rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--g6);display:block;margin-top:-3px}
h1{font-family:'Playfair Display',serif;font-size:1.85rem;font-weight:700;color:var(--g9);margin-bottom:8px;text-align:center}
h1 em{font-style:italic;color:var(--g6)}
.sub{font-size:0.875rem;color:var(--text3);font-weight:400;line-height:1.7;margin-bottom:28px;text-align:center}
.form-label{display:block;font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.form-input{width:100%;height:46px;border:1.5px solid var(--border);border-radius:9px;padding:0 14px;font-family:'Nunito',sans-serif;font-size:0.9rem;outline:none;background:var(--warm);color:var(--text);transition:border-color 0.2s;margin-bottom:16px}
.form-input:focus{border-color:var(--g6)}
.divider{text-align:center;font-size:0.75rem;color:var(--text3);margin:4px 0 16px;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:38%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:48px;border:1.5px solid var(--border);border-radius:9px;background:white;font-family:'Nunito',sans-serif;font-size:0.875rem;font-weight:600;color:var(--text);cursor:pointer;transition:border-color 0.2s,box-shadow 0.2s;margin-bottom:10px}
.btn-google:hover{border-color:var(--g5);box-shadow:0 2px 14px var(--shadow)}
.btn-google svg{width:20px;height:20px;flex-shrink:0}
.btn-primary{width:100%;height:48px;border-radius:9px;border:none;cursor:pointer;background:var(--g7);color:white;font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:700;letter-spacing:0.03em;transition:background 0.2s,transform 0.15s;margin-bottom:10px}
.btn-primary:hover{background:var(--g6);transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}
#status{padding:12px 14px;border-radius:8px;font-size:0.845rem;margin-top:4px;display:none;font-weight:500}
#status.success{background:var(--g0);color:var(--g7)}
#status.error{background:#FFF5F5;color:#c53030}
#status.loading{background:#F5F5F5;color:var(--text3)}
.note{font-size:0.72rem;color:var(--text3);line-height:1.65;margin-top:16px;text-align:center}
.note a{color:var(--g6);text-decoration:none}
.ref-wrap{background:var(--g0);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.ref-wrap label{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--g6);display:block;margin-bottom:6px}
.ref-wrap input{width:100%;height:38px;border:1px solid var(--border);border-radius:7px;padding:0 12px;font-family:'Nunito',sans-serif;font-size:0.875rem;background:white;outline:none;text-transform:uppercase;letter-spacing:0.08em}
.ref-wrap input:focus{border-color:var(--g5)}
.ref-note{font-size:0.7rem;color:var(--g6);margin-top:5px;font-weight:400}
.wa-link{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:white;border-radius:9px;height:44px;text-decoration:none;font-size:0.86rem;font-weight:700;transition:background 0.2s;margin-top:8px}
.wa-link:hover{background:#1ebb59}
.wa-link svg{width:18px;height:18px;fill:white}
</style>
</head>
<body>
<a href="index.html" class="back-link">← Back to Home</a>
<div class="card">
  <a href="index.html" class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.5 2 5 4.5 5 8.5c0 2.5 1.3 4.7 3.2 6V19h7.6v-4.5C17.7 13.2 19 11 19 8.5 19 4.5 15.5 2 12 2z"/></svg></div>
    <div><span class="logo-text">SatvikMeals</span><span class="logo-sub">Patna, Bihar</span></div>
  </a>
  <h1>Welcome <em>back.</em></h1>
  <p class="sub">Sign in to manage your subscription, meals, and delivery.</p>
  <div class="ref-wrap">
    <label>Referral Code (Optional)</label>
    <input type="text" id="refInput" placeholder="e.g. ABC123" maxlength="8"/>
    <div class="ref-note">Have a friend's referral code? Enter it before signing in.</div>
  </div>
  <div id="googleSignInDiv"></div>
  <button class="btn-google" id="googleBtn" onclick="startGoogleLogin()" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Continue with Google
  </button>
  <div id="devBox">
    <div class="divider">sign in with your details</div>
    <label class="form-label">Full Name</label>
    <input class="form-input" id="devName" placeholder="Your Name" type="text"/>
    <label class="form-label">Email Address</label>
    <input class="form-input" id="devEmail" placeholder="your@email.com" type="email"/>
    <button class="btn-primary" id="loginBtn" onclick="devLogin()">Sign In to Dashboard</button>
  </div>
  <div id="status"></div>
  <a href="https://wa.me/919031447621?text=Hi!%20I%20need%20help%20with%20my%20SatvikMeals%20account." target="_blank" class="wa-link">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.115 1.524 5.845L.057 23.95l6.265-1.643A11.934 11.934 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.007-1.367l-.36-.214-3.72.976.992-3.626-.234-.373A9.817 9.817 0 012.182 12C2.182 6.58 6.58 2.182 12 2.182S21.818 6.58 21.818 12 17.42 21.818 12 21.818z"/></svg>
    Need help? Message us on WhatsApp
  </a>
  <p class="note">By continuing you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
</div>
<script>
const API='';const GOOGLE_CLIENT_ID='';
if(localStorage.getItem('satvikToken')){const redirect=new URLSearchParams(window.location.search).get('redirect')||'dashboard.html';window.location.href=redirect;}
const refCode=new URLSearchParams(window.location.search).get('ref')||'';
if(refCode)document.getElementById('refInput').value=refCode.toUpperCase();
if(GOOGLE_CLIENT_ID){document.getElementById('devBox').style.display='none';document.getElementById('googleBtn').style.display='flex';const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>{google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleGoogleCredential,auto_select:false});google.accounts.id.renderButton(document.getElementById('googleSignInDiv'),{theme:'outline',size:'large',width:332,text:'continue_with'});};document.head.appendChild(s);}
async function handleGoogleCredential(response){showStatus('Signing in...','loading');const referralCode=document.getElementById('refInput').value.trim().toUpperCase();try{const r=await fetch(API+'/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:response.credential,referralCode})});const d=await r.json();if(!r.ok)throw new Error(d.message);saveAndRedirect(d);}catch(err){showStatus(err.message||'Login failed','error');}}
async function devLogin(){const name=document.getElementById('devName').value.trim();const email=document.getElementById('devEmail').value.trim().toLowerCase();const referralCode=document.getElementById('refInput').value.trim().toUpperCase();if(!name||!email){showStatus('Please enter your name and email.','error');return;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showStatus('Please enter a valid email.','error');return;}const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Signing in...';showStatus('Signing in...','loading');try{const r=await fetch(API+'/api/auth/dev-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,referralCode})});const d=await r.json();if(!r.ok)throw new Error(d.message);saveAndRedirect(d);}catch(err){showStatus(err.message||'Login failed. Is server running?','error');btn.disabled=false;btn.textContent='Sign In to Dashboard';}}
function saveAndRedirect(d){localStorage.setItem('satvikToken',d.token);localStorage.setItem('satvikUser',JSON.stringify(d.user));showStatus('Login successful! Redirecting...','success');const redirect=new URLSearchParams(window.location.search).get('redirect')||'dashboard.html';setTimeout(()=>{window.location.href=d.user.role==='admin'?'admin.html':redirect;},700);}
function showStatus(msg,type){const s=document.getElementById('status');s.textContent=msg;s.className=type;s.style.display='block';}
</script>
</body>
</html>
